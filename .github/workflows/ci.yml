name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"

jobs:
  test:
    name: Test and Credo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre_ledger
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_ledger
          ref: f024f8a5e6e8bff5a37522308aa0b1271e5e20cc
          path: _compat/spectre_ledger
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          echo "SPECTRE_LEDGER_PATH=$GITHUB_WORKSPACE/_compat/spectre_ledger" >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      - name: Verify published Spectre dependency
        run: mix deps | grep -E '^\* spectre 0\.4\.[0-9]+ \(Hex package\)'

      - name: Run Credo (non-strict)
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out compatible spectre_ledger
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre_ledger
          ref: f024f8a5e6e8bff5a37522308aa0b1271e5e20cc
          path: _compat/spectre_ledger
          persist-credentials: false

      - name: Select compatible dependency sources
        run: |
          echo "SPECTRE_LEDGER_PATH=$GITHUB_WORKSPACE/_compat/spectre_ledger" >> "$GITHUB_ENV"

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer
